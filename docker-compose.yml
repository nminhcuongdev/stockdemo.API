version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stockdemo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - stockdemo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong@Passw0rd123' -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  stockdemo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockdemo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__StockDemoConnectionString: "Server=sqlserver;Database=StockDemoDB;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      # Firebase service-account key for FCM push notifications (file mounted below, git-ignored).
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-sa.json
    ports:
      - "5000:8080"
    volumes:
      - ./firebase-sa.json:/app/firebase-sa.json:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - stockdemo-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  stockdemo-network:
    driver: bridge